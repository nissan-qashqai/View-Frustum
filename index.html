<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Visualization </title>
    
</head>
<style>
    body{
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        padding: 0;
    }
    .container{
        width: auto;
        height: auto;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .canvas_container{
        width: auto;
        height: auto;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }

    .interactive{
        width: 200px;
        height: 600px;
        background-color: antiquewhite;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }
    .range_box{
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }
</style>
<body >
    <div class="container">
        <div class="canvas_container">
        <canvas id="canvas_perspective" width="600" height="300"></canvas>
        <canvas id="canvas_ortho" width="600" height="300"></canvas>
        </div>
    <div class="interactive">

        <div class="range_box">
            <label class="control_label">Translate Z</label>
                <input type="range"
                id="translateZ" min="-1"
                max="1" step="0.01", value="0">
            <span id="translateZvalue" >0</span>
        </div>
        <div class="range_box">
            <label class="control_label">Translate X</label>
                <input type="range"
                id="translateX" min="-1"
                max="1" step="0.01", value="0">
            <span id="translateXvalue" >0</span>
        </div>

        <div class="range_box">
            <label class="control_label">Translate Y</label>
                <input type="range"
                id="translateY" min="-1"
                max="1" step="0.01", value="0">
            <span id="translateYvalue" >0</span>
        </div>

        <div class="range_box">
            <label class="control_label">Rotate in Z-axis</label>
                <input type="range"
                id="rotateZ" min="-3.14"
                max="3.14" step="0.01", value="0">
            <span id="rotateZvalue" >0</span>
        </div>
        <div class="range_box">
            <label class="control_label">Rotate in X-axis</label>
                <input type="range"
                id="rotateX" min="-3.14"
                max="3.14" step="0.01", value="0">
            <span id="rotateXvalue" >0</span>
        </div>

        <div class="range_box">
            <label class="control_label">Rotate in Y-axis</label>
                <input type="range"
                id="rotateY" min="-3.14"
                max="3.14" step="0.01", value="0">
            <span id="rotateYvalue" >0</span>
        </div>
            <div class="range_box">
            <label class="control_label">Camera X position</label>
                <input type="range"
                id="cameraX" min="-3"
                max="3" step="0.01", value="0">
            <span id="cameraXvalue" >0</span>
        </div>

         <div class="range_box">
            <label class="control_label">Camera Y position</label>
                <input type="range"
                id="cameraY" min="-3"
                max="3" step="0.01", value="0">
            <span id="cameraYvalue" >0</span>
        </div>

        <div class="range_box">
            <label class="control_label">Vertical Fov</label>
                <input type="range"
                id="vfov" min="0"
                max="3.14" step="0.01", value="1.04">
            <span id="vfovValue" >1.04</span>
        </div>

        <div class="range_box">
            <label class="control_label">Near</label>
                <input type="range"
                id="near" min="1"
                max="4" step="0.01", value="1">
            <span id="nearValue" >1</span>
        </div>

        <div class="range_box">
            <label class="control_label">Far</label>
                <input type="range"
                id="far" min="1"
                max="4" step="0.01", value="4">
            <span id="farValue" >4</span>
        </div>

    </div>
    </div>

</body>
<script type="module" src="./perspective copy.js" ></script>

</html>
